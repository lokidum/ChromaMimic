      <h1>ChromaMimic: Free Colour-Grading LUT Maker</h1>
      <p>
        ChromaMimic is a free, browser-based AI colour-grading LUT maker. It matches any film look
        from two frames (an original and a reference still) and exports a downloadable .cube or .dng
        LUT for DaVinci Resolve, Premiere Pro and Final Cut. The colour engine runs entirely in your
        browser, so nothing is uploaded.
      </p>
      <h2>How to create a LUT from a reference image</h2>
      <ol>
        <li>Load your original (ungraded) frame.</li>
        <li>Load a reference still with the look you want.</li>
        <li>Build: ChromaMimic learns the colour transform automatically (optimal transport, histogram and Reinhard matching).</li>
        <li>Refine with grade controls, then export the .cube or .dng.</li>
      </ol>
      <h2>What you can export</h2>
      <ul>
        <li>.cube: 3D LUT for Resolve, Premiere, Final Cut, Photoshop</li>
        <li>.dng: 16-bit graded still for Lightroom, Camera Raw, Capture One</li>
        <li>.png: graded still. .xmp: Lightroom grade preset</li>
      </ul>
      <h2>Is ChromaMimic an AI LUT generator?</h2>
      <p>
        Yes, in the practical sense: it automatically learns the colour transform between two frames
        using colour-science algorithms rather than a generative model, so results are predictable
        and instant. It is a free, private alternative to AI LUT tools like fylm.ai and
        lutbuilder.ai, with no account needed to grade and nothing uploaded. Built by
        <a href="https://nunik.co">Nunik Co.</a>
      </p>
